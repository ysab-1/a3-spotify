<div class="row">
	@if(track) {
		<div class="col-sm-6 col-12">
			<h1>{{ track.name }}</h1>
			<p>
				Track on <a [routerLink]="track.album.url">{{ track.album.name }}</a>
            </p>
			</p>
			<div>
				@for (artist of track.artists; track artist.name) {
					<p>
						Artist: <a [routerLink]="artist.url">{{ artist.name }}</a>
					</p>
				}
			</div>
			<p>
				Duration: {{ track.duration }}
			</p>
			<p>
				<a [href]="track.spotifyUrl" class="btn btn-light" role="button" target="_blank">Open {{ track.name }} on Spotify</a>
			</p>
		</div>
		<div class="col-sm-6 col-12">
			<h3>Popularity</h3>
			<app-thermometer [popularity]="track.popularity"></app-thermometer>
		</div>
	}
</div>
