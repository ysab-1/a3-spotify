@if (resources && resources.length > 0) {
  <div [id]="carouselId" class="carousel slide carousel-fade" data-bs-ride="carousel">
    <div class="carousel-inner">
      @for (resource of resources; track resource.id; let first = $first) {
        <div class="carousel-item" [class.active]="first">
          <app-carousel-card [resource]="resource"></app-carousel-card>
        </div>
      }
    </div>
    <button class="carousel-control-prev" type="button" [attr.data-bs-target]="'#' + carouselId" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" [attr.data-bs-target]="'#' + carouselId" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
}
