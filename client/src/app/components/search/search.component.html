<h1>Search Spotify</h1>
<input type="text" class="form-control mb-2" [(ngModel)]="searchString" (keyup.enter)="search()" placeholder="Search..."">
<select class="form-select mb-2" [(ngModel)]="searchCategory">
	<option *ngFor="let cat of searchCategories" [value]="cat">{{ cat }}</option>
</select>
<button class="btn btn-light mb-3" (click)="search()">Search</button>
<app-carousel *ngIf="searchCategory === 'artist' || searchCategory === 'album'" [resources]="resources" [carouselId]="'searchCarousel'"></app-carousel>
<app-track-list *ngIf="searchCategory === 'track'" [tracks]="resources"></app-track-list>
